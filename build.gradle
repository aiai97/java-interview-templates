plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'org.fulfillrouter'
version = '0.0.1-SNAPSHOT'
description = 'java-interview-templates'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

def registerExampleTask = { String taskName, String exampleClass ->
    tasks.register(taskName, JavaExec) {
        group = 'examples'
        description = "Run ${exampleClass}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = exampleClass
    }
}

registerExampleTask('runCoreJavaExamples', 'org.fulfillrouter.javainterviewtemplates.examples.CoreJavaExamples')
registerExampleTask('runCollectionExamples', 'org.fulfillrouter.javainterviewtemplates.examples.CollectionExamples')
registerExampleTask('runConcurrencyExamples', 'org.fulfillrouter.javainterviewtemplates.examples.ConcurrencyExamples')
registerExampleTask('runInfrastructureExamples', 'org.fulfillrouter.javainterviewtemplates.examples.InfrastructureExamples')
